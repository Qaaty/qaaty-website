<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8791E8"/>
      <stop offset="100%" stop-color="#4D48C4"/>
    </linearGradient>
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6D8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFD34D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFD34D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5F1FF"/>
      <stop offset="45%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- gold string lights, hanging from the top only — not reaching the bottom -->
  <g stroke="#E8B923" stroke-width="2.5" opacity="0.85">
    <line x1="70"  y1="0" x2="70"  y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="230" y1="0" x2="230" y2="260"/>
    <line x1="310" y1="0" x2="310" y2="260"/>
    <line x1="390" y1="0" x2="390" y2="360"/>
    <line x1="460" y1="0" x2="460" y2="300"/>
  </g>

  <!-- bulbs: soft glow halo + bright core + tiny highlight, for a more realistic lit look -->
  <g id="bulbs">
    <!-- string 1 -->
    <g><circle cx="70" cy="60"  r="20" fill="url(#bulbGlow)"/><circle cx="70" cy="60"  r="8" fill="#FFCA3A"/><circle cx="70" cy="57"  r="2.5" fill="#FFF9E6"/></g>
    <g><circle cx="70" cy="160" r="20" fill="url(#bulbGlow)"/><circle cx="70" cy="160" r="8" fill="#FFCA3A"/><circle cx="70" cy="157" r="2.5" fill="#FFF9E6"/></g>
    <g><circle cx="70" cy="260" r="20" fill="url(#bulbGlow)"/><circle cx="70" cy="260" r="8" fill="#FFCA3A"/><circle cx="70" cy="257" r="2.5" fill="#FFF9E6"/></g>
    <!-- string 2 -->
    <g><circle cx="150" cy="90"  r="20" fill="url(#bulbGlow)"/><circle cx="150" cy="90"  r="8" fill="#FFCA3A"/><circle cx="150" cy="87"  r="2.5" fill="#FFF9E6"/></g>
    <g><circle cx="150" cy="200" r="20" fill="url(#bulbGlow)"/><circle cx="150" cy="200" r="8" fill="#FFCA3A"/><circle cx="150" cy="197" r="2.5" fill="#FFF9E6"/></g>
    <g><circle cx="150" cy="320" r="20" fill="url(#bulbGlow)"/><circle cx="150" cy="320" r="8" fill="#FFCA3A"/><circle cx="150" cy="317" r="2.5" fill="#FFF9E6"/></g>
    <!-- string 3 -->
    <g><circle cx="230" cy="50"  r="20" fill="url(#bulbGlow)"/><circle cx="230" cy="50"  r="8" fill="#FFCA3A"/><circle cx="230" cy="47"  r="2.5" fill="#FFF9E6"/></g>
    <g><circle cx="230" cy="150" r="20" fill="url(#bulbGlow)"/><circle cx="230" cy="150" r="8" fill="#FFCA3A"/><circle cx="230" cy="147" r="2.5" fill="#FFF9E6"/></g>
    <!-- string 4 -->
    <g><circle cx="310" cy="50"  r="20" fill="url(#bulbGlow)"/><circle cx="310" cy="50"  r="8" fill="#FFCA3A"/><circle cx="310" cy="47"  r="2.5" fill="#FFF9E6"/></g>
    <g><circle cx="310" cy="150" r="20" fill="url(#bulbGlow)"/><circle cx="310" cy="150" r="8" fill="#FFCA3A"/><circle cx="310" cy="147" r="2.5" fill="#FFF9E6"/></g>
    <!-- string 5 -->
    <g><circle cx="390" cy="90"  r="20" fill="url(#bulbGlow)"/><circle cx="390" cy="90"  r="8" fill="#FFCA3A"/><circle cx="390" cy="87"  r="2.5" fill="#FFF9E6"/></g>
    <g><circle cx="390" cy="200" r="20" fill="url(#bulbGlow)"/><circle cx="390" cy="200" r="8" fill="#FFCA3A"/><circle cx="390" cy="197" r="2.5" fill="#FFF9E6"/></g>
    <g><circle cx="390" cy="320" r="20" fill="url(#bulbGlow)"/><circle cx="390" cy="320" r="8" fill="#FFCA3A"/><circle cx="390" cy="317" r="2.5" fill="#FFF9E6"/></g>
    <!-- string 6 -->
    <g><circle cx="460" cy="60"  r="20" fill="url(#bulbGlow)"/><circle cx="460" cy="60"  r="8" fill="#FFCA3A"/><circle cx="460" cy="57"  r="2.5" fill="#FFF9E6"/></g>
    <g><circle cx="460" cy="160" r="20" fill="url(#bulbGlow)"/><circle cx="460" cy="160" r="8" fill="#FFCA3A"/><circle cx="460" cy="157" r="2.5" fill="#FFF9E6"/></g>
    <g><circle cx="460" cy="260" r="20" fill="url(#bulbGlow)"/><circle cx="460" cy="260" r="8" fill="#FFCA3A"/><circle cx="460" cy="257" r="2.5" fill="#FFF9E6"/></g>
  </g>

  <!-- wedding arch / gateway -->
  <path d="M170,404 L170,258 A86,86 0 0 1 342,258 L342,404 L314,404 L314,268 A58,58 0 0 0 198,268 L198,404 Z" fill="#FFFFFF"/>
  <rect x="146" y="404" width="220" height="14" rx="7" fill="#FFFFFF"/>

  <!-- red carpet with gold borders, leading out from the entrance all the way to the bottom edge -->
  <path d="M180,418 L332,418 L382,512 L130,512 Z" fill="#C41E3A" stroke="#E8B923" stroke-width="4" stroke-linejoin="round"/>
  <path d="M191,420 L151,510" stroke="#E8B923" stroke-width="2.5" opacity="0.85"/>
  <path d="M321,420 L361,510" stroke="#E8B923" stroke-width="2.5" opacity="0.85"/>

  <!-- small gold engagement rings, replacing the old dot -->
  <g fill="none" stroke="#E8B923" stroke-width="5">
    <circle cx="245" cy="196" r="15"/>
    <circle cx="267" cy="196" r="15"/>
  </g>

  <!-- small faceted blue diamond, mounted on top of the right ring -->
  <path d="M267,171 L275,180 L267,189 L259,180 Z" fill="url(#diamondGrad)" stroke="#0D47A1" stroke-width="1"/>
  <path d="M267,171 L267,189 M259,180 L275,180" stroke="#E3F7FF" stroke-width="1" opacity="0.7"/>
  <path d="M262,175 L264,177 L262,179 L260,177 Z" fill="#FFFFFF" opacity="0.9"/>
</svg>
